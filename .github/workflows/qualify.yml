name: Package qualification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  TOKA_VERSION: v1.0.0-rc.9

jobs:
  qualify:
    name: Standalone package qualification (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            asset: toka-v1.0.0-rc.9-linux-x64.tar.gz
            sha256: 432b27087a89d2519e1a50726ed31f6556e4ed130e3d91c2315713c1cd099097
          - name: macos-arm64
            runner: macos-15
            asset: toka-v1.0.0-rc.9-macos-arm64.tar.gz
            sha256: d13622ffad63db32479db78095bf66b96b4976c0d15aa6c30257e676d66f64ac
    steps:
      - name: Check out package
        uses: actions/checkout@v4

      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          sudo apt-get install -y libssl3 zlib1g libzstd1 libstdc++6 libgcc-s1

      - name: Install macOS runtime dependencies
        if: runner.os == 'macOS'
        run: brew install lld@20 zstd openssl@3

      - name: Install locked Toka SDK
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/${{ matrix.asset }}"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/tokalang/toka/releases/download/$TOKA_VERSION/${{ matrix.asset }}"
          echo "${{ matrix.sha256 }}  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/${{ matrix.asset }}"
          sdk="${sdk%.tar.gz}"
          "$sdk/bin/toka" --version | grep -F '1.0.0-rc.9'
          "$sdk/bin/tokac" --version | grep -F '1.0.0-rc.9'
          echo "TOKA=$sdk/bin/toka" >> "$GITHUB_ENV"
          echo "TOKAC=$sdk/bin/tokac" >> "$GITHUB_ENV"
          echo "TOKA_LIB=$sdk/lib" >> "$GITHUB_ENV"

      - name: Qualify standalone package
        run: python3 tests/qualify_package.py
